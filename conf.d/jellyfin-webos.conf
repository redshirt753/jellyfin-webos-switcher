# jellyfin-webos-switcher: conf.d/jellyfin-webos.conf
#
# Sits in front of Jellyfin, either on its own or behind your reverse proxy.
# Passes everything through unchanged, except that HTML pages get one extra
# <script> tag before </body>. Expects the Jellyfin container to be reachable
# as "jellyfin" on port 8096 (same Docker network). Change $jellyfin below if
# yours is named differently.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind a reverse proxy: pass on the scheme it reports (usually https).
# On its own: no such header, so use this server's own scheme (http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Log the path only, never the query string. Jellyfin puts api_key=<token>
# in query strings for images and streams, and the default log format would
# write those tokens to disk.
log_format noquery '$remote_addr [$time_local] "$request_method $uri" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout noquery;
    # nginx error lines include the full request line, query string and all,
    # e.g. 'request: "GET /socket?api_key=<token>..."' when Jellyfin restarts.
    # crit hides those. Set to "error" temporarily if you need to debug.
    error_log /dev/stderr crit;

    client_max_body_size 0;

    # Re-resolve the jellyfin container via Docker DNS, so a restart that
    # changes its IP doesn't break the proxy.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $jellyfin http://jellyfin:8096;

    location = /__health {
        access_log off;
        return 200 "ok\n";
    }

    # Injected script(s). The path is chosen to avoid any Jellyfin route.
    location /__webos-inject/ {
        alias /usr/share/nginx/inject/;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass $jellyfin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSockets
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # sub_filter needs uncompressed upstream responses
        proxy_set_header Accept-Encoding "";

        # Don't buffer video streams or uploads
        proxy_buffering off;
        proxy_request_buffering off;

        # sub_filter applies to text/html by default
        sub_filter_once on;
        sub_filter '</body>' '<script src="/__webos-inject/webos.js"></script></body>';
    }
}